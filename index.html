<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Embed — Webflow Embed Code Generator</title>
  <meta name="description"
    content="Paste your custom HTML, CSS, and JavaScript code and instantly copy it as a Webflow-ready embed snippet. Free, fast, and beautiful." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />

  <!-- CodeMirror 5 from CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="Auditory/Gaara.svg">
</head>

<body>

  <!-- Animated background orbs -->
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Header -->
  <header class="header" id="header">
    <div class="header-inner">
      <div class="logo">
        <img class="logo-icon" width="32" height="32" src="Auditory/Gaara.svg" alt="Gaara Logo">
        <span class="logo-text">Free Embed</span>
      </div>
      <p class="tagline">Paste your code → Copy as Webflow Embed</p>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main" id="main">

    <!-- Editor Panel -->
    <section class="panel editor-panel" id="editor-panel">
      <div class="panel-header">
        <h1 class="panel-title">Code Editor</h1>
        <div class="tabs" id="editor-tabs" role="tablist">
          <button class="tab active" data-tab="html" role="tab" aria-selected="true" id="tab-html">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M2 2l1.5 12L8 15.5 12.5 14 14 2H2z" stroke="currentColor" stroke-width="1.2" />
              <path d="M5 5h6l-.3 3H8v2.5l-2.5-.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
            HTML
          </button>
          <button class="tab" data-tab="css" role="tab" aria-selected="false" id="tab-css">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M2 2l1.5 12L8 15.5 12.5 14 14 2H2z" stroke="currentColor" stroke-width="1.2" />
              <path d="M5 5h6l-.2 2H8.5L8 9.5l-2-.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
            CSS
          </button>
          <button class="tab" data-tab="js" role="tab" aria-selected="false" id="tab-js">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.2" />
              <path
                d="M7 6v4.5c0 .8-.7 1.5-1.5 1.5M9.5 6c1 0 1.5.5 1.5 1.2s-.5 1.3-1.5 1.3 1.5.5 1.5 1.3-.5 1.2-1.5 1.2"
                stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            JS
          </button>
        </div>
      </div>
      <div class="editor-container" id="editor-container">
        <div class="editor-pane active" id="pane-html">
          <textarea id="code-html"></textarea>
        </div>
        <div class="editor-pane" id="pane-css">
          <textarea id="code-css"></textarea>
        </div>
        <div class="editor-pane" id="pane-js">
          <textarea id="code-js"></textarea>
        </div>
      </div>
    </section>

    <!-- Right Column: Preview + Output -->
    <div class="right-column">

      <!-- Preview Panel -->
      <section class="panel preview-panel" id="preview-panel">
        <div class="panel-header">
          <h2 class="panel-title">Live Preview</h2>
          <button class="btn btn-ghost" id="btn-refresh" title="Refresh preview">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M13.5 2.5v4h-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
                stroke-linejoin="round" />
              <path d="M12.3 10a5 5 0 11-1-6l2.2 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </button>
        </div>
        <div class="preview-frame-wrapper">
          <iframe id="preview-iframe" sandbox="allow-scripts allow-same-origin" title="Live Preview"></iframe>
        </div>
      </section>

      <!-- Output Panel -->
      <section class="panel output-panel" id="output-panel">
        <div class="panel-header">
          <h2 class="panel-title">Webflow Component</h2>
          <div class="btn-group">
            <button class="btn btn-ghost btn-sm" id="btn-copy-raw" title="Copy raw HTML/CSS/JS code">
              <svg class="btn-icon" width="14" height="14" viewBox="0 0 16 16" fill="none">
                <path d="M4 4l4-2.5L12 4v4l-4 2.5L4 8V4z" stroke="currentColor" stroke-width="1.3"
                  stroke-linejoin="round" />
                <path d="M4 8l4 2.5L12 8" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
              </svg>
              <span class="btn-label">Copy Raw Code</span>
            </button>
            <button class="btn btn-primary" id="btn-copy"
              title="Copy as Webflow component — paste directly into Webflow Designer">
              <svg class="btn-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.4" />
                <path d="M11 5V3.5A1.5 1.5 0 009.5 2h-6A1.5 1.5 0 002 3.5v6A1.5 1.5 0 003.5 11H5" stroke="currentColor"
                  stroke-width="1.4" />
              </svg>
              <span class="btn-label">Copy to Webflow</span>
            </button>
          </div>
        </div>
        <div class="output-container">
          <div class="output-hint">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2" />
              <path d="M8 5v1M8 8v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
            <span>Click <strong>Copy to Webflow</strong> → Go to Webflow Designer → <strong>Ctrl/Cmd+V</strong> to paste
              the embed component.</span>
          </div>
          <pre id="output-code" class="output-code"></pre>
        </div>
      </section>

    </div>
  </main>

  <!-- Toast notification -->
  <div class="toast" id="toast" aria-live="polite">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <circle cx="9" cy="9" r="8" stroke="currentColor" stroke-width="1.5" />
      <path d="M6 9l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <span id="toast-msg">Copied to clipboard!</span>
  </div>

  <script src="app.js"></script>
</body>

</html>
